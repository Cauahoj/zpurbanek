<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Děkujeme za poptávku – Zemní práce Urbánek</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1A1A1A" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap&subset=latin-ext" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261031e" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; position: relative; overflow: hidden; }
    .ty { position: relative; z-index: 1; max-width: 560px; }
    .ty__check { width: 96px; height: 96px; margin: 0 auto 30px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; box-shadow: 0 0 0 12px rgba(245,193,0,.18); animation: pop .7s var(--ease) both; }
    .ty__check svg { width: 46px; height: 46px; fill: none; stroke: var(--accent-ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s var(--ease) .45s forwards; }
    .ty h1 { font-size: clamp(40px, 7vw, 64px); line-height: 1.02; letter-spacing: -0.035em; margin-bottom: 18px; }
    .ty p { color: var(--muted); font-size: 18px; margin-bottom: 32px; }
    .ty__acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ty__check svg { stroke-dashoffset: 0; } }
  </style>
</head>
<body>
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <main class="ty">
    <div class="ty__check"><svg viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="eyebrow">Poptávka odeslána</div>
    <h1>Děkujeme, <span class="accent-w">ozveme se.</span></h1>
    <p>Vaši zprávu jsme dostali. Brzy se vám ozveme s nezávaznou nabídkou. Spěchá to? Zavolejte, jsme na telefonu 24/7.</p>
    <div class="ty__acts">
      <a href="tel:+420777310268" class="btn btn--primary"><svg class="i" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>+420 777 310 268</a>
      <a href="index.html" class="btn btn--ghost">Zpět na web</a>
    </div>
  </main>
</body>
</html>
